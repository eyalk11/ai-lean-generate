name: AI Lean Generate
description: Generate Lean 4 verification files with a coding agent and compile them independently.
author: eyalk11

branding:
  icon: check-circle
  color: purple

inputs:
  provider:
    description: Coding agent. One of claude-code or codex.
    required: false
    default: claude-code
  model:
    description: Provider model ID. Empty selects a provider-specific default.
    required: false
    default: ""
  source-paths:
    description: Deprecated and ignored; the coding agent inspects the Git diff directly.
    required: false
    default: ""
  context-files:
    description: Deprecated and ignored; the coding agent reads repository files directly.
    required: false
    default: ""
  imports:
    description: Newline-separated Lean modules the generated file should import.
    required: false
    default: ""
  task:
    description: Additional instructions describing the verification check to generate.
    required: false
    default: Generate meaningful compile-time checks for the changed Lean declarations.
  max-repair-attempts:
    description: Number of repair calls after the initial generation attempt.
    required: false
    default: "2"
  agent-max-turns:
    description: Maximum Claude Code turns in coding-agent mode.
    required: false
    default: "20"
  output-file:
    description: Legacy optional single target file. Empty lets the agent choose project filenames.
    required: false
    default: ""
  target-files:
    description: Optional newline-separated Lean files to request. Empty lets the agent choose; additions are discovered through Git diff.
    required: false
    default: ""
  verification-command:
    description: Optional additional shell command run after mandatory Lean checks with provider and GitHub credentials removed.
    required: false
    default: ""
  setup-lean:
    description: Whether to install the caller project's Lean toolchain.
    required: false
    default: "true"
  build-project:
    description: Whether lean-action should run lake build before generating the check.
    required: false
    default: "true"
  use-mathlib-cache:
    description: Passed to leanprover/lean-action.
    required: false
    default: auto
  upload-artifact:
    description: Upload the generated source and diagnostic log.
    required: false
    default: "true"
  artifact-name:
    description: Name of the generated-files and diagnostics artifact.
    required: false
    default: ai-lean-generate
  base-sha:
    description: Base commit for the pull-request diff. Defaults to the pull-request base SHA.
    required: false
    default: ""
  head-sha:
    description: Head commit for the pull-request diff. Defaults to the checked-out commit.
    required: false
    default: ""
  max-context-bytes:
    description: Deprecated and ignored.
    required: false
    default: "200000"
  max-input-tokens:
    description: Deprecated and ignored in coding-agent mode.
    required: false
    default: "50000"
  max-output-tokens:
    description: Per-response output-token cap passed to the agent as CLAUDE_CODE_MAX_OUTPUT_TOKENS.
    required: false
    default: "128000"
  deps-sorry-policy:
    description: Handling of sorry/admit inside designated dependency files. One of warn or reject.
    required: false
    default: warn
  edit-policy:
    description: |
      Whether the coding agent may edit tracked Lean files. One of edit or
      add-only. Default edit: repairing an existing proof is often the correct
      fix, and forbidding it forces the agent to bolt on a parallel file.
      add-only restricts it to additions, but project mapping files stay
      editable in both modes -- see project-mapping-files.
    required: false
    default: edit
  project-mapping-files:
    description: |
      Newline-separated globs the agent may edit even under edit-policy=add-only.
      A newly added module is unusable until Lake sees it in the library
      roots/globs and the root module imports it, so these must stay editable.
      Callers whose root module is not a lakefile should add it, e.g. lean/FEI.lean.
    required: false
    default: |
      lakefile.toml
      lakefile.lean
  axiom-policy:
    description: |
      Audit of which generated declarations transitively depend on sorryAx.
      One of warn, reject or off. The sorry-allowed-files policy is file-based
      and cannot see that a policy-clean theorem imports a sorry-carrying lemma;
      this asks Lean instead, at declaration granularity.
    required: false
    default: warn
  sorry-allowed-files:
    description: Newline-separated dependency file globs where baseline assumptions may use sorry/admit.
    required: false
    default: "**/*_deps.lean"
  pr-number:
    description: |
      Source pull request that receives the live progress comment. Empty
      disables progress reporting.
    required: false
    default: ""
  github-token:
    description: |
      Token used only to post and edit the progress comment on pr-number. It
      needs pull-requests: write and nothing else. It is never exposed to the
      coding agent: the sandbox runs with --clearenv and the agent step blanks
      GITHUB_TOKEN and GH_TOKEN explicitly.
    required: false
    default: ""
  progress-comment:
    description: |
      Post one comment on the source pull request when the run starts and edit
      it in place as phases complete, including a live mirror of the coding
      agent's own task list. Requires pr-number and github-token.
    required: false
    default: "true"
  ask-publish-on-failure:
    description: |
      When independent verification fails but generated files exist, ask the
      coding agent once whether the partial result is still worth a pull
      request. The strict yes/no answer is exposed as the publish-on-failure
      output; anything unclear counts as no. claude-code only.
    required: false
    default: "true"

outputs:
  generated-file:
    description: First generated Lean file, for compatibility.
    value: ${{ steps.verify-agent.outputs.generated-file }}
  generated-files:
    description: Newline-separated generated Lean files discovered from Git.
    value: ${{ steps.verify-agent.outputs.generated-files }}
  attempts:
    description: Reserved for compatibility; coding-agent providers manage their own turns.
    value: ${{ steps.verify-agent.outputs.attempts }}
  publish-on-failure:
    description: '"true" when verification failed but the agent judged the partial result worth publishing.'
    value: ${{ steps.publish-verdict.outputs.publish-on-failure }}
  progress-comment-id:
    description: ID of the progress comment posted on the source pull request.
    value: ${{ steps.progress-start.outputs.progress-comment-id }}

runs:
  using: composite
  steps:
    - name: Set up and build Lean project
      if: inputs.setup-lean == 'true'
      uses: leanprover/lean-action@v1
      with:
        auto-config: false
        build: ${{ inputs.build-project }}
        test: false
        lint: false
        use-mathlib-cache: ${{ inputs.use-mathlib-cache }}

    - name: Validate coding-agent provider
      shell: bash
      run: |
        case "${{ inputs.provider }}" in
          claude-code|codex) ;;
          *) echo "::error::provider must be 'claude-code' or 'codex'"; exit 1 ;;
        esac

    - name: Prepare coding-agent task
      id: prepare-agent
      shell: bash
      env:
        AI_LEAN_IMPORTS: ${{ inputs.imports }}
        AI_LEAN_TASK: ${{ inputs.task }}
        AI_LEAN_OUTPUT_FILE: ${{ inputs.output-file }}
        AI_LEAN_TARGET_FILES: ${{ inputs.target-files }}
        AI_LEAN_BASE_SHA: ${{ inputs.base-sha }}
        AI_LEAN_HEAD_SHA: ${{ inputs.head-sha }}
        AI_LEAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        AI_LEAN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        AI_LEAN_DEPS_SORRY_POLICY: ${{ inputs.deps-sorry-policy }}
        AI_LEAN_SORRY_ALLOWED_FILES: ${{ inputs.sorry-allowed-files }}
        AI_LEAN_AXIOM_POLICY: ${{ inputs.axiom-policy }}
        AI_LEAN_EDIT_POLICY: ${{ inputs.edit-policy }}
        AI_LEAN_PROJECT_MAPPING_FILES: ${{ inputs.project-mapping-files }}
        AI_LEAN_AGENT_MAX_TURNS: ${{ inputs.agent-max-turns }}
        AI_LEAN_PROGRESS_TASKS: ${{ inputs.progress-comment == 'true' && inputs.pr-number != '' && inputs.github-token != '' }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/prepare_agent.py"

    # Posted before any long-running step so the pull request shows the run is
    # alive from the start. Everything afterwards edits this same comment, so
    # the notification fires once and the visible state is never stale.
    - name: Open the pull-request progress comment
      id: progress-start
      if: >-
        inputs.progress-comment == 'true' && inputs.pr-number != ''
        && inputs.github-token != ''
        && steps.prepare-agent.outputs.should-run == 'true'
      shell: bash
      env:
        AI_LEAN_PROGRESS_TOKEN: ${{ inputs.github-token }}
        AI_LEAN_PR_NUMBER: ${{ inputs.pr-number }}
        AI_LEAN_PROGRESS_PROVIDER: ${{ inputs.provider }}
        AI_LEAN_PROGRESS_MODEL: ${{ inputs.model }}
        AI_LEAN_PROGRESS_MAX_TURNS: ${{ inputs.agent-max-turns }}
        AI_LEAN_PROGRESS_HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
          set --phase prepare --status ok
        python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
          set --phase agent --status running --detail "agent starting"

    - name: Set up Claude Code sandbox
      if: inputs.provider == 'claude-code' && steps.prepare-agent.outputs.should-run == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/setup_claude_sandbox.sh"

    # The base action writes its execution log only after Claude exits, so it
    # cannot drive a live view. The CLI's own session transcript is appended
    # continuously under the sandbox HOME, which lives in RUNNER_TEMP and is
    # readable from the runner, so a background watcher outside the sandbox can
    # follow the agent's TodoWrite list while it works.
    - name: Start the agent task-list watcher
      if: >-
        inputs.provider == 'claude-code' && steps.progress-start.outcome == 'success'
        && steps.prepare-agent.outputs.should-run == 'true'
      shell: bash
      env:
        AI_LEAN_PROGRESS_TOKEN: ${{ inputs.github-token }}
        AI_LEAN_PR_NUMBER: ${{ inputs.pr-number }}
        AI_LEAN_PROGRESS_PROVIDER: ${{ inputs.provider }}
        AI_LEAN_PROGRESS_MODEL: ${{ inputs.model }}
        AI_LEAN_PROGRESS_MAX_TURNS: ${{ inputs.agent-max-turns }}
        AI_LEAN_PROGRESS_HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
      run: |
        mkdir -p .ai-lean-generate
        rm -f .ai-lean-generate/progress-watch.stop
        nohup python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" watch \
          > .ai-lean-generate/progress-watch.log 2>&1 &
        echo "$!" > .ai-lean-generate/progress-watch.pid

    # Bash is unrestricted on purpose. The per-command allowlist stopped being
    # a boundary once the agent had workspace write, because it could rewrite
    # run-lean-sanitized.sh -- the one command the allowlist permitted. What it
    # still did was refuse commands the prompt itself asks for: the `git diff
    # A...B` fallback reads as "multiple operations", and any `2>&1 | tail` is
    # rejected as shell syntax that cannot be statically analyzed. On PR #32
    # that burned 4 of 17 Bash turns. The sandbox is the boundary now.
    # WebFetch stays out: the sandbox does not restrict network egress.
    - name: Generate and test with Claude Code
      id: claude-agent
      if: inputs.provider == 'claude-code' && steps.prepare-agent.outputs.should-run == 'true'
      uses: anthropics/claude-code-base-action@main
      env:
        # Read by claude-bwrap.sh to scale the sandbox timeout with the turn
        # budget. Not passed into the sandbox itself; --clearenv drops it.
        AI_LEAN_AGENT_MAX_TURNS: ${{ inputs.agent-max-turns }}
        # Forwarded into the sandbox by claude-bwrap.sh. The CLI defaults to
        # 32000 per response, which is what killed the run on PR #129.
        CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_CACHE_URL: ""
        ACTIONS_RESULTS_URL: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        prompt_file: .ai-lean-generate/agent-prompt.md
        path_to_claude_code_executable: ${{ github.action_path }}/scripts/claude-bwrap.sh
        claude_args: >-
          --model ${{ inputs.model || 'claude-sonnet-4-6' }}
          --max-turns ${{ inputs.agent-max-turns }}
          --setting-sources user
          --allowed-tools Read,Glob,Grep,Write,Edit,Bash${{ steps.prepare-agent.outputs.progress-tasks == 'true' && ',TodoWrite' || '' }}

    - name: Capture Claude diagnostics
      if: always() && inputs.provider == 'claude-code' && steps.prepare-agent.outputs.should-run == 'true'
      shell: bash
      env:
        CLAUDE_CONCLUSION: ${{ steps.claude-agent.outputs.conclusion }}
        CLAUDE_EXECUTION_FILE: ${{ steps.claude-agent.outputs.execution_file }}
        CLAUDE_OUTCOME: ${{ steps.claude-agent.outcome }}
      run: |
        mkdir -p .ai-lean-generate
        {
          echo "step_outcome=${CLAUDE_OUTCOME:-unknown}"
          echo "conclusion=${CLAUDE_CONCLUSION:-unknown}"
          echo "execution_file=${CLAUDE_EXECUTION_FILE:-}"
        } > .ai-lean-generate/claude-summary.txt
        if [ -n "${CLAUDE_EXECUTION_FILE:-}" ] && [ -f "$CLAUDE_EXECUTION_FILE" ]; then
          cp "$CLAUDE_EXECUTION_FILE" .ai-lean-generate/claude-execution.json
          echo "--- execution tail ---" >> .ai-lean-generate/claude-summary.txt
          tail -c 16000 "$CLAUDE_EXECUTION_FILE" >> .ai-lean-generate/claude-summary.txt
          printf '\n' >> .ai-lean-generate/claude-summary.txt
        fi
        cat .ai-lean-generate/claude-summary.txt
        # Token use is reported here rather than from a status line. The status
        # line is an interactive-terminal feature and the base action runs
        # Claude headlessly, so it never fired and produced no usage file; the
        # execution log is written unconditionally.
        python3 "$GITHUB_ACTION_PATH/scripts/token_usage_report.py" || true

    - name: Report the agent result on the pull request
      if: >-
        always() && steps.progress-start.outcome == 'success'
        && inputs.provider == 'claude-code'
      shell: bash
      env:
        AI_LEAN_PROGRESS_TOKEN: ${{ inputs.github-token }}
        AI_LEAN_PR_NUMBER: ${{ inputs.pr-number }}
        AI_LEAN_PROGRESS_PROVIDER: ${{ inputs.provider }}
        AI_LEAN_PROGRESS_MODEL: ${{ inputs.model }}
        AI_LEAN_PROGRESS_MAX_TURNS: ${{ inputs.agent-max-turns }}
        AI_LEAN_PROGRESS_HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
        CLAUDE_OUTCOME: ${{ steps.claude-agent.outcome }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" stop || true
        pid="$(cat .ai-lean-generate/progress-watch.pid 2>/dev/null || true)"
        if [ -n "$pid" ]; then
          kill "$pid" 2>/dev/null || true
        fi
        if [ "${CLAUDE_OUTCOME:-}" = "success" ]; then
          status=ok
          detail="agent finished; verifying independently"
        else
          status=fail
          detail="agent step outcome: ${CLAUDE_OUTCOME:-unknown}"
        fi
        python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
          set --phase agent --status "$status" --detail "$detail" --refresh-todos
        if [ "$status" = ok ]; then
          python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
            set --phase verify --status running
        fi

    - name: Generate and test with Codex
      id: codex-agent
      if: inputs.provider == 'codex' && steps.prepare-agent.outputs.should-run == 'true'
      uses: openai/codex-action@v1
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
      with:
        openai-api-key: ${{ env.OPENAI_API_KEY }}
        prompt-file: .ai-lean-generate/agent-prompt.md
        output-file: .ai-lean-generate/codex-final.txt
        model: ${{ inputs.model }}
        sandbox: workspace-write
        safety-strategy: drop-sudo

    # Codex has no task list to mirror and no watcher, so it only needs the
    # phase transition the Claude branch does above.
    - name: Report the Codex result on the pull request
      if: >-
        always() && steps.progress-start.outcome == 'success'
        && inputs.provider == 'codex'
      shell: bash
      env:
        AI_LEAN_PROGRESS_TOKEN: ${{ inputs.github-token }}
        AI_LEAN_PR_NUMBER: ${{ inputs.pr-number }}
        AI_LEAN_PROGRESS_PROVIDER: ${{ inputs.provider }}
        AI_LEAN_PROGRESS_MODEL: ${{ inputs.model }}
        AI_LEAN_PROGRESS_HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
        CODEX_OUTCOME: ${{ steps.codex-agent.outcome }}
      run: |
        if [ "${CODEX_OUTCOME:-}" = "success" ]; then
          python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
            set --phase agent --status ok --detail "agent finished; verifying independently"
          python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
            set --phase verify --status running
        else
          python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
            set --phase agent --status fail --detail "agent step outcome: ${CODEX_OUTCOME:-unknown}"
        fi

    - name: Independently verify coding-agent result
      id: verify-agent
      if: steps.prepare-agent.outputs.should-run == 'true' && (inputs.provider == 'codex' || steps.claude-agent.outcome == 'success')
      shell: bash
      env:
        AI_LEAN_OUTPUT_FILE: ${{ inputs.output-file }}
        AI_LEAN_TARGET_FILES: ${{ inputs.target-files }}
        AI_LEAN_IMPORTS: ${{ inputs.imports }}
        AI_LEAN_VERIFICATION_COMMAND: ${{ inputs.verification-command }}
        AI_LEAN_AXIOM_POLICY: ${{ inputs.axiom-policy }}
        AI_LEAN_EDIT_POLICY: ${{ inputs.edit-policy }}
        AI_LEAN_PROJECT_MAPPING_FILES: ${{ inputs.project-mapping-files }}
        AI_LEAN_SORRY_ALLOWED_FILES: ${{ inputs.sorry-allowed-files }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/verify_agent.py"

    - name: Report the verification result on the pull request
      if: always() && steps.progress-start.outcome == 'success'
      shell: bash
      env:
        AI_LEAN_PROGRESS_TOKEN: ${{ inputs.github-token }}
        AI_LEAN_PR_NUMBER: ${{ inputs.pr-number }}
        AI_LEAN_PROGRESS_PROVIDER: ${{ inputs.provider }}
        AI_LEAN_PROGRESS_MODEL: ${{ inputs.model }}
        AI_LEAN_PROGRESS_MAX_TURNS: ${{ inputs.agent-max-turns }}
        AI_LEAN_PROGRESS_HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
        VERIFY_OUTCOME: ${{ steps.verify-agent.outcome }}
        GENERATED_FILES: ${{ steps.verify-agent.outputs.generated-files }}
      run: |
        count="$(printf '%s\n' "$GENERATED_FILES" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
        case "${VERIFY_OUTCOME:-}" in
          success)
            detail="$count Lean file(s) compiled and the project build passed"
            status=ok
            ;;
          skipped|"")
            detail="not reached"
            status=skip
            ;;
          *)
            detail="verification failed with $count generated Lean file(s)"
            status=fail
            ;;
        esac
        python3 "$GITHUB_ACTION_PATH/scripts/pr_progress.py" \
          set --phase verify --status "$status" --detail "$detail"

    # A verification failure with generated files present is a partial result,
    # and only the agent has read them all. One cheap read-only query decides
    # whether they are worth a reviewer's time; the caller may then publish a
    # clearly-marked pull request instead of discarding the work. Safety
    # rejections never reach here: on those verify-agent exits before setting
    # generated-files, and the gate below stays closed.
    - name: Prepare publish verdict prompt
      id: verdict-prompt
      if: >-
        always() && inputs.provider == 'claude-code'
        && inputs.ask-publish-on-failure == 'true'
        && steps.verify-agent.outcome == 'failure'
        && steps.verify-agent.outputs.generated-files != ''
      shell: bash
      env:
        AI_LEAN_GENERATED_FILES: ${{ steps.verify-agent.outputs.generated-files }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/publish_verdict.py" --prompt

    - name: Ask the agent whether the failed result is worth publishing
      id: verdict-agent
      if: always() && steps.verdict-prompt.outcome == 'success'
      uses: anthropics/claude-code-base-action@main
      env:
        AI_LEAN_AGENT_MAX_TURNS: "4"
        CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_CACHE_URL: ""
        ACTIONS_RESULTS_URL: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        prompt_file: .ai-lean-generate/publish-verdict-prompt.md
        path_to_claude_code_executable: ${{ github.action_path }}/scripts/claude-bwrap.sh
        claude_args: >-
          --model ${{ inputs.model || 'claude-sonnet-4-6' }}
          --max-turns 4
          --setting-sources user
          --allowed-tools Read,Glob,Grep

    - name: Record publish verdict
      id: publish-verdict
      if: always() && steps.verdict-prompt.outcome == 'success'
      shell: bash
      env:
        VERDICT_EXECUTION_FILE: ${{ steps.verdict-agent.outputs.execution_file }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/publish_verdict.py" --parse

    - name: Upload generated Lean check
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.verify-agent.outputs.generated-files }}
          .ai-lean-generate/diagnostics.txt
          .ai-lean-generate/agent-prompt.md
          .ai-lean-generate/publish-verdict-prompt.md
          .ai-lean-generate/claude-summary.txt
          .ai-lean-generate/claude-execution.json
          .ai-lean-generate/codex-final.txt
          .ai-lean-generate/check-files.txt
          .ai-lean-generate/run-lean-sanitized.sh
          .ai-lean-generate/token-usage.json
          .ai-lean-generate/progress.json
        if-no-files-found: warn
        include-hidden-files: true

    - name: Fail when Claude failed
      if: inputs.provider == 'claude-code' && steps.prepare-agent.outputs.should-run == 'true' && steps.claude-agent.outcome != 'success'
      shell: bash
      run: |
        cat .ai-lean-generate/claude-summary.txt || true
        exit 1
